---
# Source: user-service/templates/database-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
  namespace: staging
  labels:
    app: user-db
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: staging-user-service
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: plain-manifests
spec:
  serviceName: user-db
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
        app.kubernetes.io/name: user-service
        app.kubernetes.io/instance: staging-user-service
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: userdb
        - name: POSTGRES_USER
          value: userservice
        - name: POSTGRES_PASSWORD
          value: userpass
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - userservice
            - -d
            - userdb
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - userservice
            - -d
            - userdb
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      storageClassName: longhorn-storageclass
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi

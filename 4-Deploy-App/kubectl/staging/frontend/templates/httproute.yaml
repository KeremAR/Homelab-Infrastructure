---
# Source: frontend/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: staging-frontend-route
  namespace: staging
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: staging-frontend
    app.kubernetes.io/managed-by: plain-manifests
spec:
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway
  hostnames:
  - todo-app-staging.192.168.0.110.nip.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/auth
    backendRefs:
    - name: user-service
      port: 8001
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users
    backendRefs:
    - name: user-service
      port: 8001
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/admin/users
    backendRefs:
    - name: user-service
      port: 8001
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/admin/create-admin
    backendRefs:
    - name: user-service
      port: 8001
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/todos
    backendRefs:
    - name: todo-service
      port: 8002
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/admin/todos
    backendRefs:
    - name: todo-service
      port: 8002
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/admin/reload-config
    backendRefs:
    - name: todo-service
      port: 8002
  - matches:
    - path:
        type: Exact
        value: /api/v1/config
    backendRefs:
    - name: todo-service
      port: 8002
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 3000

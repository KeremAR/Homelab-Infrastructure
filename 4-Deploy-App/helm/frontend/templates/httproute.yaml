{{- if .Values.gateway.enabled }}
apiVersion: {{ .Values.gateway.apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.routeName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/instance: {{ .Values.instance }}
    app.kubernetes.io/managed-by: {{ .Values.managedBy }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentName }}
      namespace: {{ .Values.gateway.parentNamespace }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
      backendRefs:
        - name: user-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/users
      backendRefs:
        - name: user-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/admin/users
      backendRefs:
        - name: user-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/admin/create-admin
      backendRefs:
        - name: user-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/todos
      backendRefs:
        - name: todo-service
          port: 8002
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/admin/todos
      backendRefs:
        - name: todo-service
          port: 8002
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/admin/reload-config
      backendRefs:
        - name: todo-service
          port: 8002
{{- if .Values.gateway.includeConfigRoute }}
    - matches:
        - path:
            type: Exact
            value: /api/v1/config
      backendRefs:
        - name: todo-service
          port: 8002
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
{{- end }}

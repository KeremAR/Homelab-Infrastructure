controller:
  admin:
    existingSecret: jenkins-admin-secret
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  serviceType: ClusterIP
  jenkinsUrl: "http://jenkins.192.168.0.110.nip.io"
  enableRawHtmlMarkupFormatter: true

  installPlugins:
    - configuration-as-code
    - credentials
    - plain-credentials
    - git
    - github
    - github-branch-source
    - job-dsl
    - kubernetes
    - kubernetes-cli
    - workflow-aggregator
    - pipeline-stage-view
    - basic-branch-build-strategies
    - timestamper
    - ws-cleanup
    - locale
    - antisamy-markup-formatter
    - lockable-resources
    - sonar
    - credentials-binding
    - dark-theme
    - dependency-track
    - copyartifact
    - blueocean

  containerEnv:
    - name: GITHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: github-username
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: github-token
    - name: SONAR_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-app-secrets
          key: sonar-token
    - name: DEPENDENCY_TRACK_API_KEY
      valueFrom:
        secretKeyRef:
          name: jenkins-app-secrets
          key: dependency-track-api-key
          optional: true

  JCasC:
    defaultConfig: true
    configScripts:
      jenkins-config: |
        jenkins:
          systemMessage: "Homelab Jenkins managed by Helm and JCasC."
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"

        appearance:
          themeManager:
            disableUserThemes: true
            theme: "darkSystem"
          locale:
            systemLocale: "en"
            ignoreAcceptLanguage: true

        tool:
          sonarRunnerInstallation:
            installations:
              - name: "SonarQube Scanner"
                properties:
                  - installSource:
                      installers:
                        - sonarRunnerInstaller:
                            id: "7.3.0.5189"

        unclassified:
          globalLibraries:
            libraries:
              - name: "homelab-shared-library"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    scm:
                      gitSource:
                        remote: "https://github.com/KeremAR/Homelab-SharedLibrary.git"
                        credentialsId: "github-token"
          sonarglobalconfiguration:
            buildWrapperEnabled: true
            installations:
              - name: "sonarqube"
                serverUrl: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
                credentialsId: "sonarqube-token"

        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-token"
                      username: "${GITHUB_USERNAME}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub token for repo scan, checkout, and later GHCR push"
                  - string:
                      scope: GLOBAL
                      id: "sonarqube-token"
                      secret: "${SONAR_TOKEN}"
                      description: "SonarQube access token"
                  - string:
                      scope: GLOBAL
                      id: "dependency-track-api-key"
                      secret: "${DEPENDENCY_TRACK_API_KEY}"
                      description: "Dependency-Track API key for SBOM upload"

        jobs:
          - script: |
              multibranchPipelineJob('homelab-app-ci') {
                displayName('Homelab App CI')
                description('Runs linting, unit tests, and Trivy checks for Homelab-App branches and pull requests.')

                branchSources {
                  github {
                    id('homelab-app-github')
                    scanCredentialsId('github-token')
                    repoOwner('KeremAR')
                    repository('Homelab-App')
                    includes('release/* PR-*')
                    excludes('feature/*')
                    buildOriginBranch(true)
                    buildOriginBranchWithPR(false)
                    buildOriginPRMerge(true)
                    buildOriginPRHead(false)
                    buildForkPRMerge(false)
                    buildForkPRHead(false)
                  }
                }

                factory {
                  workflowBranchProjectFactory {
                    scriptPath('Jenkinsfile')
                  }
                }

                orphanedItemStrategy {
                  discardOldItems {
                    numToKeep(10)
                  }
                }

                triggers {
                  periodicFolderTrigger {
                    interval('1')
                  }
                }
              }

              def createReleaseJob = {
                String jobName,
                String display,
                String serviceName,
                String contextPath,
                String dockerfilePath,
                String defaultBranch,
                String dockerCachePvc,
                String registryRepository ->
                pipelineJob(jobName) {
                  displayName(display)
                  description("Manual release pipeline for ${serviceName}. It reuses the latest successful release-branch CI artifact, or rebuilds when explicitly allowed.")

                  parameters {
                    stringParam('RELEASE_BRANCH', defaultBranch, 'Release branch to deploy, for example release/user-service-v1.0')
                    choiceParam('DEPLOY_ENVIRONMENT', ['staging', 'prod'], 'Registry tag/deploy environment suffix.')
                    booleanParam('REBUILD_IF_CI_NOT_SUCCESS', false, 'If the latest CI build is not SUCCESS, checkout the release branch and build inside this release job.')
                    stringParam('SERVICE_NAME', serviceName, 'Managed by JCasC. Logical service/image name.')
                    stringParam('CONTEXT_PATH', contextPath, 'Managed by JCasC. Docker build context.')
                    stringParam('DOCKERFILE_PATH', dockerfilePath, 'Managed by JCasC. Dockerfile path.')
                    stringParam('DOCKER_CACHE_PVC', dockerCachePvc, 'Managed by JCasC. Service-specific Docker cache PVC.')
                    stringParam('REGISTRY_REPOSITORY', registryRepository, 'Managed by JCasC. Target GHCR repository name.')
                  }

                  definition {
                    cpsScm {
                      scm {
                        git {
                          remote {
                            url('https://github.com/KeremAR/Homelab-SharedLibrary.git')
                            credentials('github-token')
                          }
                          branch('*/main')
                        }
                      }
                      scriptPath('pipelines/release/Jenkinsfile')
                      lightweight(true)
                    }
                  }
                }
              }

              createReleaseJob(
                'release-user-service',
                'User Service Release',
                'user-service',
                'user-service',
                'user-service/Dockerfile',
                'release/user-service-v1.0',
                'jenkins-docker-cache-user-service-pvc',
                'todo-app-user-service'
              )

              createReleaseJob(
                'release-todo-service',
                'Todo Service Release',
                'todo-service',
                'todo-service',
                'todo-service/Dockerfile',
                'release/todo-service-v1.0',
                'jenkins-docker-cache-todo-service-pvc',
                'todo-app-todo-service'
              )

              createReleaseJob(
                'release-frontend',
                'Frontend Release',
                'frontend',
                'frontend',
                'frontend/Dockerfile',
                'release/frontend-v1.0',
                'jenkins-docker-cache-frontend-pvc',
                'todo-app-frontend'
              )

persistence:
  enabled: true
  existingClaim: jenkins-home-pvc

serviceAccount:
  create: false
  name: jenkins

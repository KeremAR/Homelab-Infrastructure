controller:
  admin:
    existingSecret: jenkins-admin-secret
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  serviceType: ClusterIP
  jenkinsUrl: "http://jenkins.192.168.0.110.nip.io"
  enableRawHtmlMarkupFormatter: true

  installPlugins:
    - configuration-as-code
    - credentials
    - plain-credentials
    - git
    - github
    - github-branch-source
    - job-dsl
    - kubernetes
    - kubernetes-cli
    - workflow-aggregator
    - pipeline-stage-view
    - basic-branch-build-strategies
    - timestamper
    - ws-cleanup
    - locale
    - antisamy-markup-formatter
    - lockable-resources
    - sonar
    - credentials-binding
    - dark-theme
    - dependency-track
    - copyartifact
    - list-git-branches-parameter
    - build-user-vars-plugin
  installLatestPlugins: false

  containerEnv:
    - name: GITHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: github-username
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: github-token
    - name: SONAR_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-app-secrets
          key: sonar-token
    - name: DEPENDENCY_TRACK_API_KEY
      valueFrom:
        secretKeyRef:
          name: jenkins-app-secrets
          key: dependency-track-api-key
          optional: true

  JCasC:
    defaultConfig: true
    configScripts:
      jenkins-config: |
        jenkins:
          systemMessage: "Homelab Jenkins managed by Helm and JCasC."
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"

        appearance:
          themeManager:
            disableUserThemes: true
            theme: "darkSystem"
          locale:
            systemLocale: "en"
            ignoreAcceptLanguage: true

        tool:
          sonarRunnerInstallation:
            installations:
              - name: "SonarQube Scanner"
                properties:
                  - installSource:
                      installers:
                        - sonarRunnerInstaller:
                            id: "7.3.0.5189"

        unclassified:
          globalLibraries:
            libraries:
              - name: "homelab-shared-library"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    scm:
                      gitSource:
                        remote: "https://github.com/KeremAR/Homelab-SharedLibrary.git"
                        credentialsId: "github-token"
          sonarglobalconfiguration:
            buildWrapperEnabled: true
            installations:
              - name: "sonarqube"
                serverUrl: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
                credentialsId: "sonarqube-token"

        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-token"
                      username: "${GITHUB_USERNAME}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub token for repo scan, checkout, and later GHCR push"
                  - string:
                      scope: GLOBAL
                      id: "sonarqube-token"
                      secret: "${SONAR_TOKEN}"
                      description: "SonarQube access token"
                  - string:
                      scope: GLOBAL
                      id: "dependency-track-api-key"
                      secret: "${DEPENDENCY_TRACK_API_KEY}"
                      description: "Dependency-Track API key for SBOM upload"

        jobs:
          - script: |
              multibranchPipelineJob('homelab-app-ci') {
                displayName('Homelab App CI')
                description('Runs linting, unit tests, and Trivy checks for Homelab-App branches and pull requests.')

                branchSources {
                  github {
                    id('homelab-app-github')
                    scanCredentialsId('github-token')
                    repoOwner('KeremAR')
                    repository('Homelab-App')
                    includes('release/* PR-*')
                    excludes('feature/*')
                    buildOriginBranch(true)
                    buildOriginBranchWithPR(false)
                    buildOriginPRMerge(true)
                    buildOriginPRHead(false)
                    buildForkPRMerge(false)
                    buildForkPRHead(false)
                  }
                }

                factory {
                  workflowBranchProjectFactory {
                    scriptPath('Jenkinsfile')
                  }
                }

                orphanedItemStrategy {
                  discardOldItems {
                    numToKeep(10)
                  }
                }

                triggers {
                  periodicFolderTrigger {
                    interval('1')
                  }
                }
              }

              def createReleaseJob = {
                String jobName,
                String display,
                String defaultBranch,
                String branchRegex ->
                pipelineJob(jobName) {
                  displayName(display)
                  description('Manual release pipeline. Select an application branch, choose the target environment, and decide whether to reuse the latest successful CI artifact.')

                  parameters {
                    listGitBranches {
                      name('RELEASE_BRANCH')
                      description('Select application branch to deploy.')
                      remoteURL('https://github.com/KeremAR/Homelab-App.git')
                      credentialsId('github-token')
                      defaultValue(defaultBranch)
                      branchFilter(branchRegex)
                      type('BRANCH')
                      sortMode('DESCENDING_SMART')
                      selectedValue('DEFAULT')
                      tagFilter('*')
                      listSize('20')
                      quickFilterEnabled(true)
                    }
                    choiceParam('DEPLOY_ENVIRONMENT', ['staging', 'prod'], 'Registry tag/deploy environment suffix.')
                    booleanParam('USE_CI_ARTIFACT', true, 'Use the selected branch CI job latest completed artifact, requiring its ci-success marker and matching commit. If unchecked, this release job builds the image itself. Production requires this to stay enabled.')
                  }

                  definition {
                    cpsScm {
                      scm {
                        git {
                          remote {
                            url('https://github.com/KeremAR/Homelab-SharedLibrary.git')
                            credentials('github-token')
                          }
                          branch('*/main')
                        }
                      }
                      scriptPath('pipelines/release/Jenkinsfile')
                      lightweight(true)
                    }
                  }
                }
              }

              createReleaseJob(
                'release-user-service',
                'User Service Release',
                'release/user-service-v1.0',
                'refs/heads/(release/user-service-.*)'
              )

              createReleaseJob(
                'release-todo-service',
                'Todo Service Release',
                'release/todo-service-v1.0',
                'refs/heads/(release/todo-service-.*)'
              )

              createReleaseJob(
                'release-frontend',
                'Frontend Release',
                'release/frontend-v1.0',
                'refs/heads/(release/frontend-.*)'
              )

persistence:
  enabled: true
  existingClaim: jenkins-home-pvc

serviceAccount:
  create: false
  name: jenkins

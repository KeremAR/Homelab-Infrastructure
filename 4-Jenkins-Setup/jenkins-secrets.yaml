# Apply with envsubst so secret values stay in your local .env file:
#
#   set -a
#   source .env
#   set +a
#   export GITHUB_DOCKER_AUTH=$(printf "%s:%s" "$GITHUB_USERNAME" "$GITHUB_TOKEN" | base64 -w0)
#   envsubst < 4-Jenkins-Setup/jenkins-secrets.yaml | kubectl apply -f -
#
# Required .env values:
#   JENKINS_ADMIN_USER=admin
#   JENKINS_ADMIN_PASSWORD=change-me
#   GITHUB_USERNAME=KeremAR
#   GITHUB_TOKEN=ghp_...
#
# One GitHub token is enough for this phase. GITHUB_DOCKER_AUTH is not a
# second token; it is only base64("username:token") for the Docker config JSON.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-secret
  namespace: jenkins
type: Opaque
stringData:
  jenkins-admin-user: "${JENKINS_ADMIN_USER}"
  jenkins-admin-password: "${JENKINS_ADMIN_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-github-secret
  namespace: jenkins
type: Opaque
stringData:
  github-username: "${GITHUB_USERNAME}"
  github-token: "${GITHUB_TOKEN}"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-creds
  namespace: jenkins
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "${GITHUB_USERNAME}",
          "password": "${GITHUB_TOKEN}",
          "auth": "${GITHUB_DOCKER_AUTH}"
        }
      }
    }

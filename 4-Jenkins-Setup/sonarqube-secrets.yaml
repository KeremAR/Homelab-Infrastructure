# Apply with envsubst so secret values stay in your local .env file:
#
#   set -a
#   source .env
#   set +a
#   envsubst < 4-Jenkins-Setup/sonarqube-secrets.yaml | kubectl apply -f -
#
# Required .env values:
#   SONARQUBE_POSTGRES_ADMIN_PASSWORD=change-me
#   SONARQUBE_DB_PASSWORD=change-me
#   SONARQUBE_MONITORING_PASSCODE=change-me
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-db-secret
  namespace: sonarqube
type: Opaque
stringData:
  postgres-password: "${SONARQUBE_POSTGRES_ADMIN_PASSWORD}"
  password: "${SONARQUBE_DB_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-monitoring-secret
  namespace: sonarqube
type: Opaque
stringData:
  monitoring-passcode: "${SONARQUBE_MONITORING_PASSCODE}"

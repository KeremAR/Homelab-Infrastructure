# Apply with envsubst so secret values stay in your local .env file:
#
#   set -a
#   source .env
#   set +a
#   envsubst < 4-Jenkins-Setup/dependency-track-secrets.yaml | kubectl apply -f -
#
# Required .env values:
#   DEPENDENCY_TRACK_POSTGRES_ADMIN_PASSWORD=change-me
#   DEPENDENCY_TRACK_DB_PASSWORD=change-me
apiVersion: v1
kind: Namespace
metadata:
  name: dependency-track
---
apiVersion: v1
kind: Secret
metadata:
  name: dtrack-db-secret
  namespace: dependency-track
type: Opaque
stringData:
  username: dtrack
  postgres-password: "${DEPENDENCY_TRACK_POSTGRES_ADMIN_PASSWORD}"
  password: "${DEPENDENCY_TRACK_DB_PASSWORD}"

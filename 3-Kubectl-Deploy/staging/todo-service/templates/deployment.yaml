---
# Source: todo-service/templates/deployment.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: todo-service
  namespace: staging
  labels:
    app: todo-service
    app.kubernetes.io/name: todo-service
    app.kubernetes.io/instance: staging-todo-service
    app.kubernetes.io/component: todo-service
    app.kubernetes.io/managed-by: plain-manifests
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: todo-service
  strategy:
    canary:
      canaryService: todo-service-canary
      stableService: todo-service
      steps:
      - setWeight: 20
      - analysis:
          templates:
          - templateName: check-todo-service-readiness
          args:
          - name: service-name
            value: todo-service-canary
          - name: port
            value: "8002"
      - pause: {}
      - setWeight: 40
      - pause: { duration: 10s }
      - analysis:
          templates:
          - templateName: check-todo-service-readiness
          args:
          - name: service-name
            value: todo-service-canary
          - name: port
            value: "8002"
      - setWeight: 60
      - pause: { duration: 10s }
      - analysis:
          templates:
          - templateName: check-todo-service-readiness
          args:
          - name: service-name
            value: todo-service-canary
          - name: port
            value: "8002"
  template:
    metadata:
      labels:
        app: todo-service
        app.kubernetes.io/name: todo-service
        app.kubernetes.io/instance: staging-todo-service
        app.kubernetes.io/component: todo-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: todo-service-config-reloader
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: github-registry-secret
      containers:
      - name: todo-service
        image: ghcr.io/keremar/todo-app-todo-service:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        env:
        - name: SECRET_KEY
          value: "dev-secret-key-change-in-production"
        - name: USER_SERVICE_URL
          value: "http://user-service:8001"
        - name: DATABASE_URL
          value: "postgresql://todoservice:todopass@todo-db:5432/tododb"
        - name: RUNTIME_CONFIG_PATH
          value: "/etc/todo-service/runtime-config/runtime-config.json"
        # OpenTelemetry Configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://alloy.observability.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_SERVICE_NAME
          value: "todo-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=staging,service.version=latest,deployment.environment=staging"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        volumeMounts:
        - name: runtime-config
          mountPath: /etc/todo-service/runtime-config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      - name: config-reloader
        image: ghcr.io/kiwigrid/k8s-sidecar:2.7.3
        imagePullPolicy: IfNotPresent
        env:
        - name: METHOD
          value: WATCH
        - name: LABEL
          value: todo-service-hot-reload
        - name: LABEL_VALUE
          value: "true"
        - name: RESOURCE
          value: configmap
        - name: NAMESPACE
          value: staging
        - name: FOLDER
          value: /etc/todo-service/runtime-config
        - name: REQ_URL
          value: http://127.0.0.1:8002/admin/reload-config
        - name: REQ_METHOD
          value: POST
        - name: REQ_RETRY_CONNECT
          value: "10"
        ports:
        - name: sidecar-health
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: sidecar-health
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: sidecar-health
          initialDelaySeconds: 35
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
        volumeMounts:
        - name: runtime-config
          mountPath: /etc/todo-service/runtime-config
      volumes:
      - name: runtime-config
        emptyDir: {}


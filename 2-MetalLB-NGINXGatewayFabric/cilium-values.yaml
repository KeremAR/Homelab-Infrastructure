# Direct replacement for Calico and kube-proxy. Downtime is expected.
k8sServiceHost: 192.168.0.150
k8sServicePort: 6443

kubeProxyReplacement: true

routingMode: tunnel
tunnelProtocol: geneve

ipam:
  # Reuse the 10.244.0.0/24 PodCIDRs already assigned in Node.spec.podCIDR.
  mode: kubernetes

cni:
  customConf: false
  uninstall: false
  # Required so Istio CNI can coexist with Cilium.
  exclusive: false

operator:
  replicas: 2
  unmanagedPodWatcher:
    restart: true

policyEnforcementMode: default

bpf:
  hostLegacyRouting: false

# Required when Istio is used with Cilium socket-level load balancing.
socketLB:
  enabled: true
  hostNamespaceOnly: true

# Do not let Cilium compete with Istio or Envoy Gateway for L7 traffic.
l7Proxy: false
envoy:
  enabled: false
ingressController:
  enabled: false
gatewayAPI:
  enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp

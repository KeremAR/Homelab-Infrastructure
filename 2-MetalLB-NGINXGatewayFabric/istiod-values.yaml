profile: ambient

global:
  logAsJson: true

meshConfig:
  enableTracing: true
  enablePrometheusMerge: false
  extensionProviders:
    - name: otel-tracing
      opentelemetry:
        service: alloy.observability.svc.cluster.local
        port: 4317

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

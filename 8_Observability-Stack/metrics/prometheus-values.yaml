server:
  retention: 7d
  retentionSize: 2GB
  persistentVolume:
    enabled: true
    existingClaim: prometheus-data
  extraArgs:
    web.enable-remote-write-receiver: ""
    enable-feature: exemplar-storage
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# Prometheus chart 29.x enables Kubernetes discovery jobs by default. Alloy is
# the collector in this stack, so keep only Prometheus self-monitoring here.
# Otherwise cAdvisor metrics are ingested once by Prometheus and once by Alloy.
scrapeConfigs:
  prometheus:
    enabled: true
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

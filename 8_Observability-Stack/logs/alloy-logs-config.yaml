apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: observability
data:
  logs.alloy: |
    // === LOG COLLECTION (ELASTICSEARCH) ===
    // ========================================

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service_name"
      }
      rule {
        target_label = "cluster"
        replacement  = "homelab"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
      rule {
        action = "replace"
        source_labels = ["__meta_kubernetes_pod_container_id"]
        regex = "^(\\w+)://.+$"
        replacement = "$1"
        target_label = "tmp_container_runtime"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets       = local.file_match.pod_logs.targets
      forward_to    = [loki.process.pod_logs.receiver]
      tail_from_end = true
    }

    loki.process "pod_logs" {
      stage.match {
        selector = "{tmp_container_runtime=\"containerd\"}"
        stage.cri {}
      }
      stage.match {
        selector = "{tmp_container_runtime=\"docker\"}"
        stage.docker {}
      }
      stage.label_drop {
        values = ["tmp_container_runtime"]
      }

      // Read the application timestamp before bridging the original line to
      // OpenTelemetry. Application fields are parsed after the bridge so they
      // can be written directly to the native OTel log model.
      stage.json {
        expressions = {
          timestamp = "timestamp",
        }
      }

      stage.timestamp {
        source = "timestamp"
        format = "RFC3339Nano"
      }

      // The Loki-to-OTel receiver does not reliably preserve Loki structured
      // metadata. Keep the original JSON body until the OTel transform below
      // maps it to the native OTel log model and semantic attributes.
      forward_to = [otelcol.receiver.loki.elasticsearch.receiver]
    }

    // Bridge the existing Loki-format collection pipeline into OpenTelemetry.
    // No Loki server is involved in this path.
    otelcol.receiver.loki "elasticsearch" {
      output {
        logs = [otelcol.processor.transform.elasticsearch_logs.input]
      }
    }

    otelcol.processor.transform "elasticsearch_logs" {
      error_mode = "ignore"

      log_statements {
        context = "log"
        statements = [
          // Parse application JSON while leaving plain-text container logs
          // untouched when the body is not a JSON object.
          `merge_maps(cache, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")`,

          // Native LogRecord fields.
          `set(severity_text, cache["severity"]) where cache["severity"] != nil`,
          `set(severity_number, SEVERITY_NUMBER_TRACE) where cache["severity"] == "TRACE"`,
          `set(severity_number, SEVERITY_NUMBER_DEBUG) where cache["severity"] == "DEBUG"`,
          `set(severity_number, SEVERITY_NUMBER_INFO) where cache["severity"] == "INFO"`,
          `set(severity_number, SEVERITY_NUMBER_WARN) where cache["severity"] == "WARN" or cache["severity"] == "WARNING"`,
          `set(severity_number, SEVERITY_NUMBER_ERROR) where cache["severity"] == "ERROR"`,
          `set(severity_number, SEVERITY_NUMBER_FATAL) where cache["severity"] == "FATAL" or cache["severity"] == "CRITICAL"`,
          `set(trace_id.string, cache["trace_id"]) where cache["trace_id"] != nil and IsMatch(cache["trace_id"], "^[0-9A-Fa-f]{32}$")`,
          `set(span_id.string, cache["span_id"]) where cache["span_id"] != nil and IsMatch(cache["span_id"], "^[0-9A-Fa-f]{16}$")`,
          `set(flags, 1) where cache["trace_sampled"] == true`,
          `set(event_name, cache["event_name"]) where cache["event_name"] != nil`,

          // First copy source labels and application identity into semantic
          // attributes. groupbyattrs below promotes these keys to Resources.
          `set(attributes["service.name"], attributes["service_name"]) where attributes["service_name"] != nil`,
          `set(attributes["service.name"], cache["service_name"]) where cache["service_name"] != nil`,
          `set(attributes["service.namespace"], cache["service_namespace"]) where cache["service_namespace"] != nil`,
          `set(attributes["service.version"], cache["service_version"]) where cache["service_version"] != nil`,
          `set(attributes["deployment.environment.name"], cache["deployment_environment"]) where cache["deployment_environment"] != nil`,
          `set(attributes["k8s.cluster.name"], attributes["cluster"]) where attributes["cluster"] != nil`,
          `set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil`,
          `set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil`,
          `set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil`,

          // Event attributes. HTTP and exception keys follow OTel semantic
          // conventions; audit-specific fields remain application attributes.
          `set(attributes["logger"], cache["logger"]) where cache["logger"] != nil`,
          `set(attributes["event.outcome"], cache["outcome"]) where cache["outcome"] != nil`,
          `set(attributes["http.request.method"], cache["http_method"]) where cache["http_method"] != nil`,
          `set(attributes["http.route"], cache["http_route"]) where cache["http_route"] != nil`,
          `set(attributes["http.response.status_code"], cache["http_status_code"]) where cache["http_status_code"] != nil`,
          `set(attributes["actor_id"], cache["actor_id"]) where cache["actor_id"] != nil`,
          `set(attributes["resource_type"], cache["resource_type"]) where cache["resource_type"] != nil`,
          `set(attributes["resource_id"], cache["resource_id"]) where cache["resource_id"] != nil`,
          `set(attributes["duration_ms"], cache["duration_ms"]) where cache["duration_ms"] != nil`,
          `set(attributes["changed_fields"], cache["changed_fields"]) where cache["changed_fields"] != nil`,
          `set(attributes["exception.type"], cache["exception_type"]) where cache["exception_type"] != nil`,
          `set(attributes["exception.message"], cache["exception_message"]) where cache["exception_message"] != nil`,
          `set(attributes["exception.stacktrace"], cache["exception"]) where cache["exception"] != nil`,

          // Remove non-semantic copies created by the Loki bridge after their
          // values have been preserved above.
          `delete_key(attributes, "service_name")`,
          `delete_key(attributes, "cluster")`,
          `delete_key(attributes, "namespace")`,
          `delete_key(attributes, "pod")`,
          `delete_key(attributes, "container")`,
          `delete_key(attributes, "loki.attribute.labels")`,

          // Elasticsearch maps the OTel body to message/body.text. Replacing
          // the raw JSON body makes both fields human-readable without
          // creating a second log event.
          `set(body, cache["message"]) where cache["message"] != nil`,
        ]
      }

      output {
        logs = [otelcol.processor.groupbyattrs.elasticsearch_logs.input]
      }
    }

    // Promote stable entity identity from LogRecord attributes to native OTel
    // Resources without mutating a Resource shared by unrelated log records.
    otelcol.processor.groupbyattrs "elasticsearch_logs" {
      keys = [
        "service.name",
        "service.namespace",
        "service.version",
        "deployment.environment.name",
        "k8s.cluster.name",
        "k8s.namespace.name",
        "k8s.pod.name",
        "k8s.container.name",
      ]

      output {
        logs = [otelcol.processor.batch.elasticsearch_logs.input]
      }
    }

    otelcol.processor.batch "elasticsearch_logs" {
      output {
        logs = [otelcol.exporter.otlphttp.elasticsearch.input]
      }
    }

    otelcol.exporter.otlphttp "elasticsearch" {
      client {
        // The exporter appends /v1/logs for the logs signal.
        endpoint = "https://logs-es-http.observability.svc:9200/_otlp"
        headers = {
          Authorization = sys.env("ELASTIC_AUTHORIZATION"),
        }
        tls {
          ca_file = "/etc/alloy/elasticsearch/ca.crt"
        }
      }
    }

    // ========================================

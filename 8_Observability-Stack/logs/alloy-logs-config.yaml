apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: observability
data:
  logs.alloy: |
    // === LOG COLLECTION (ELASTICSEARCH) ===
    // ========================================

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service_name"
      }
      rule {
        target_label = "cluster"
        replacement  = "homelab"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
      rule {
        action = "replace"
        source_labels = ["__meta_kubernetes_pod_container_id"]
        regex = "^(\\w+)://.+$"
        replacement = "$1"
        target_label = "tmp_container_runtime"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.match {
        selector = "{tmp_container_runtime=\"containerd\"}"
        stage.cri {}
      }
      stage.match {
        selector = "{tmp_container_runtime=\"docker\"}"
        stage.docker {}
      }
      stage.label_drop {
        values = ["tmp_container_runtime"]
      }

      // Application services emit one JSON object per stdout line. The JSON
      // stage is intentionally non-destructive: plain-text logs from other
      // containers remain available when no JSON fields are found.
      stage.json {
        expressions = {
          timestamp               = "timestamp",
          severity                = "severity",
          logger                  = "logger",
          message                 = "message",
          service_name            = "service_name",
          service_namespace       = "service_namespace",
          service_version         = "service_version",
          deployment_environment  = "deployment_environment",
          trace_id                = "trace_id",
          span_id                 = "span_id",
          trace_sampled           = "trace_sampled",
          event_name              = "event_name",
          actor_id                = "actor_id",
          resource_type           = "resource_type",
          resource_id             = "resource_id",
          outcome                 = "outcome",
          http_method             = "http_method",
          http_route              = "http_route",
          http_status_code        = "http_status_code",
          duration_ms             = "duration_ms",
          changed_fields          = "changed_fields",
          exception_type          = "exception_type",
          exception_message       = "exception_message",
          exception               = "exception",
        }
      }

      stage.timestamp {
        source = "timestamp"
        format = "RFC3339Nano"
      }

      // Keep only low-cardinality dimensions as indexed labels.
      stage.labels {
        values = {
          severity               = "",
          logger                 = "",
          service_name           = "",
          service_namespace      = "",
          deployment_environment = "",
          event_name             = "",
          outcome                = "",
          http_method            = "",
          http_status_code       = "",
        }
      }

      // The Loki-to-OTel receiver does not reliably preserve Loki structured
      // metadata. Keep the original JSON body until the OTel transform below
      // promotes the application fields to Elasticsearch attributes.
      forward_to = [otelcol.receiver.loki.elasticsearch.receiver]
    }

    // Bridge the existing Loki-format collection pipeline into OpenTelemetry.
    // No Loki server is involved in this path.
    otelcol.receiver.loki "elasticsearch" {
      output {
        logs = [otelcol.processor.transform.elasticsearch_logs.input]
      }
    }

    otelcol.processor.transform "elasticsearch_logs" {
      error_mode = "ignore"

      log_statements {
        context = "log"
        statements = [
          // Parse application JSON while leaving plain-text container logs
          // untouched when the body is not a JSON object.
          `merge_maps(cache, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")`,

          // Keep application fields as OTel attributes rather than relying on
          // Loki structured metadata surviving the Loki-to-OTel bridge.
          `set(attributes["severity"], cache["severity"]) where cache["severity"] != nil`,
          `set(attributes["logger"], cache["logger"]) where cache["logger"] != nil`,
          `set(attributes["service_name"], cache["service_name"]) where cache["service_name"] != nil`,
          `set(attributes["service_namespace"], cache["service_namespace"]) where cache["service_namespace"] != nil`,
          `set(attributes["deployment_environment"], cache["deployment_environment"]) where cache["deployment_environment"] != nil`,
          `set(attributes["event_name"], cache["event_name"]) where cache["event_name"] != nil`,
          `set(attributes["outcome"], cache["outcome"]) where cache["outcome"] != nil`,
          `set(attributes["http_method"], cache["http_method"]) where cache["http_method"] != nil`,
          `set(attributes["http_status_code"], cache["http_status_code"]) where cache["http_status_code"] != nil`,
          `set(attributes["service_version"], cache["service_version"]) where cache["service_version"] != nil`,
          `set(attributes["trace_id"], cache["trace_id"]) where cache["trace_id"] != nil`,
          `set(attributes["span_id"], cache["span_id"]) where cache["span_id"] != nil`,
          `set(attributes["trace_sampled"], cache["trace_sampled"]) where cache["trace_sampled"] != nil`,
          `set(attributes["actor_id"], cache["actor_id"]) where cache["actor_id"] != nil`,
          `set(attributes["resource_type"], cache["resource_type"]) where cache["resource_type"] != nil`,
          `set(attributes["resource_id"], cache["resource_id"]) where cache["resource_id"] != nil`,
          `set(attributes["http_route"], cache["http_route"]) where cache["http_route"] != nil`,
          `set(attributes["duration_ms"], cache["duration_ms"]) where cache["duration_ms"] != nil`,
          `set(attributes["changed_fields"], cache["changed_fields"]) where cache["changed_fields"] != nil`,
          `set(attributes["exception_type"], cache["exception_type"]) where cache["exception_type"] != nil`,
          `set(attributes["exception_message"], cache["exception_message"]) where cache["exception_message"] != nil`,
          `set(attributes["exception"], cache["exception"]) where cache["exception"] != nil`,

          // Elasticsearch maps the OTel body to message/body.text. Replacing
          // the raw JSON body makes both fields human-readable without
          // creating a second log event.
          `set(body, cache["message"]) where cache["message"] != nil`,
        ]
      }

      output {
        logs = [otelcol.processor.batch.elasticsearch_logs.input]
      }
    }

    otelcol.processor.batch "elasticsearch_logs" {
      output {
        logs = [otelcol.exporter.otlphttp.elasticsearch.input]
      }
    }

    otelcol.exporter.otlphttp "elasticsearch" {
      client {
        // The exporter appends /v1/logs for the logs signal.
        endpoint = "https://logs-es-http.observability.svc:9200/_otlp"
        headers = {
          Authorization = sys.env("ELASTIC_AUTHORIZATION"),
        }
        tls {
          ca_file = "/etc/alloy/elasticsearch/ca.crt"
        }
      }
    }

    // ========================================

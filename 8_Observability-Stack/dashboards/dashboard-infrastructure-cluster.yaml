apiVersion: v1
kind: ConfigMap
metadata:
  name: infrastructure-cluster-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  infrastructure-cluster.json: |
    {
      "title": "Infrastructure & Cluster - Node & Pod Resource Analysis",
      "uid": "infrastructure-cluster",
      "tags": ["infrastructure", "cluster", "nodes", "pods", "resources"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "node",
            "type": "query",
            "label": "Node",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(node_uname_info, instance)",
            "refresh": 1,
            "includeAll": true,
            "multi": false,
            "allValue": ".*",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}, namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "🖥️ CPU Saturation (%) - $node",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\", instance=~\"$node\"}[5m])) * 100)",
              "refId": "A"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 70, "color": "yellow"},
                  {"value": 85, "color": "red"}
                ]
              },
              "unit": "percent",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "id": 2,
          "title": "🧠 Memory Saturation (%) - $node",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes{instance=~\"$node\"}) / sum(node_memory_MemTotal_bytes{instance=~\"$node\"})))",
              "refId": "A"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 75, "color": "yellow"},
                  {"value": 90, "color": "red"}
                ]
              },
              "unit": "percent",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "id": 3,
          "title": "💾 Disk Usage (%) - $node",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "100 - ((sum(node_filesystem_avail_bytes{instance=~\"$node\", fstype!~\"tmpfs|fuse.lxcfs|squashfs|vfat\"}) / sum(node_filesystem_size_bytes{instance=~\"$node\", fstype!~\"tmpfs|fuse.lxcfs|squashfs|vfat\"})) * 100)",
              "refId": "A"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 80, "color": "yellow"},
                  {"value": 90, "color": "red"}
                ]
              },
              "unit": "percent",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "id": 4,
          "title": "📡 Network Traffic (In/Out) - $node",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(node_network_receive_bytes_total{instance=~\"$node\", device!~\"lo|veth.*|docker.*|flannel.*|cali.*\"}[5m])) / 1024 / 1024",
              "refId": "A",
              "legendFormat": "In"
            },
            {
              "expr": "sum(rate(node_network_transmit_bytes_total{instance=~\"$node\", device!~\"lo|veth.*|docker.*|flannel.*|cali.*\"}[5m])) / 1024 / 1024",
              "refId": "B",
              "legendFormat": "Out"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "blue"}
                ]
              },
              "unit": "MBs",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value"
          }
        },
        {
          "id": 5,
          "title": "🖥️ Node CPU Usage (%) - Filtered by $node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\"$node\"}[5m])) * 100)",
              "refId": "A",
              "legendFormat": "{{instance}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 20,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 70, "color": "yellow"},
                  {"value": 85, "color": "red"}
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 6,
          "title": "🧠 Node Memory Usage (%) - Filtered by $node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{instance=~\"$node\"} / node_memory_MemTotal_bytes{instance=~\"$node\"}))",
              "refId": "A",
              "legendFormat": "{{instance}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 20,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 75, "color": "yellow"},
                  {"value": 90, "color": "red"}
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 7,
          "title": "💾 Node Disk I/O (Read/Write MB/s) - Filtered by $node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum by (instance) (rate(node_disk_read_bytes_total{instance=~\"$node\"}[5m])) / 1024 / 1024",
              "refId": "A",
              "legendFormat": "{{instance}} - Read"
            },
            {
              "expr": "sum by (instance) (rate(node_disk_written_bytes_total{instance=~\"$node\"}[5m])) / 1024 / 1024",
              "refId": "B",
              "legendFormat": "{{instance}} - Write"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "MBs",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 8,
          "title": "📡 Node Network Traffic (MB/s) - Filtered by $node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total{instance=~\"$node\", device!~\"lo|veth.*|docker.*|flannel.*|cali.*\"}[5m])) / 1024 / 1024",
              "refId": "A",
              "legendFormat": "{{instance}} - Receive"
            },
            {
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total{instance=~\"$node\", device!~\"lo|veth.*|docker.*|flannel.*|cali.*\"}[5m])) / 1024 / 1024",
              "refId": "B",
              "legendFormat": "{{instance}} - Transmit"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "MBs",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 9,
          "title": "🏆 Top 10 Pod Resource Consumers - $node",
          "description": "Shows the ten highest-memory pods for the selected node scope and namespaces. Click Memory or CPU to reorder the displayed rows. Node is intentionally omitted from the table; use the Node selector to narrow the scope.",
          "type": "table",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{node=~\"$node\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}) by (namespace, pod) / 1024 / 1024",
              "refId": "A",
              "format": "table",
              "instant": true
            },
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{node=~\"$node\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[5m])) by (namespace, pod)",
              "refId": "B",
              "format": "table",
              "instant": true
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "transformations": [
            {"id": "merge"},
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "Value #A": 2,
                  "Value #B": 3
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "Value #A": "Memory (MiB)",
                  "Value #B": "CPU (cores)"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {"field": "Memory (MiB)", "desc": true}
                ]
              }
            },
            {"id": "limit", "options": {"limitField": "10"}}
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Memory (MiB)"},
                "properties": [
                  {"id": "unit", "value": "mbytes"},
                  {"id": "decimals", "value": 1},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {"value": null, "color": "transparent"},
                        {"value": 100, "color": "rgba(237, 129, 40, 0.2)"},
                        {"value": 500, "color": "rgba(245, 54, 54, 0.3)"}
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {"id": "byName", "options": "CPU (cores)"},
                "properties": [
                  {"id": "unit", "value": "cores"},
                  {"id": "decimals", "value": 3},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {"value": null, "color": "transparent"},
                        {"value": 0.5, "color": "rgba(237, 129, 40, 0.2)"},
                        {"value": 1, "color": "rgba(245, 54, 54, 0.3)"}
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": []
          }
        },
        {
          "id": 11,
          "title": "⚠️ Problematic Pod Events (OOMKilled, CrashLoop, ImagePull, Evicted)",
          "type": "table",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 30},
          "targets": [
            {
              "expr": "kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull\"} > 0",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "kube_pod_container_status_terminated_reason{reason=~\"OOMKilled|Error\"} > 0",
              "refId": "B",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "kube_pod_status_reason{reason=~\"Evicted|NodeLost|FailedScheduling\"} > 0",
              "refId": "C",
              "instant": true,
              "format": "table"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "uid": true,
                  "id": true,
                  "container": true
                },
                "indexByName": {
                  "node": 0,
                  "namespace": 1,
                  "pod": 2,
                  "reason": 3,
                  "Value": 4
                },
                "renameByName": {
                  "node": "Node",
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "reason": "Event Reason",
                  "Value": "Status"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "color-background"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "red"}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Event Reason"},
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-text"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "OOMKilled": {"color": "dark-red", "text": "🔴 OOMKilled (Memory Limit)"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "CrashLoopBackOff": {"color": "dark-orange", "text": "🟠 CrashLoopBackOff"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "ImagePullBackOff": {"color": "dark-yellow", "text": "🟡 ImagePullBackOff"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "ErrImagePull": {"color": "dark-yellow", "text": "🟡 ErrImagePull"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Evicted": {"color": "dark-purple", "text": "🟣 Evicted (Node Pressure)"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "FailedScheduling": {"color": "dark-blue", "text": "🔵 FailedScheduling"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Error": {"color": "dark-red", "text": "🔴 Error"}
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": []
          }
        },
        {
          "id": 12,
          "title": "🔄 Pod Restart Rate (Last 5m)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 38},
          "targets": [
            {
              "expr": "topk(10, rate(kube_pod_container_status_restarts_total[5m]) > 0)",
              "refId": "A",
              "legendFormat": "{{namespace}}/{{pod}} - {{container}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "fillOpacity": 50,
                "showPoints": "never"
              },
              "color": {"mode": "palette-classic"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 0.01, "color": "red"}
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        }
      ]
    }

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Envoy Gateway

configMapGenerator:
  - name: grafana-dashboards-envoy-gateway-official
    files:
      - envoy-gateway-global.json
      - envoy-proxy-global.json
      - envoy-clusters.json
      - resources-monitor.gen.json

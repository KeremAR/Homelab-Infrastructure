apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pyroscope
  namespace: observability
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway
  hostnames:
    - pyroscope.192.168.0.110.nip.io
  rules:
    - backendRefs:
        - name: pyroscope
          port: 4040

apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-analysis-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  memory-analysis.json: |
    {
      "title": "Node Memory Analysis",
      "uid": "node-memory-analysis",
      "tags": ["memory", "troubleshooting", "nodes"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [{
          "name": "node",
          "type": "query",
          "label": "Node",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "query": "label_values(node_uname_info, instance)",
          "refresh": 1
        }]
      },
      "panels": [
        {
          "id": 1,
          "title": "Memory Usage",
          "type": "stat",
          "gridPos": {"h": 5, "w": 24, "x": 0, "y": 0},
          "targets": [
            {"expr": "(node_memory_MemTotal_bytes{instance=\"$node\"} - node_memory_MemAvailable_bytes{instance=\"$node\"}) / 1024 / 1024", "refId": "A", "legendFormat": "Used"},
            {"expr": "node_memory_MemTotal_bytes{instance=\"$node\"} / 1024 / 1024", "refId": "B", "legendFormat": "Total"}
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "mbytes"}}
        },
        {
          "id": 2,
          "title": "Top Memory-Consuming Pods",
          "type": "table",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 5},
          "targets": [{
            "expr": "topk(20, sum(container_memory_working_set_bytes{node=\"$node\", container!=\"\", container!=\"POD\"}) by (namespace, pod)) / 1024 / 1024",
            "refId": "A",
            "format": "table",
            "instant": true
          }],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "mbytes"}}
        },
        {
          "id": 3,
          "title": "Top Five Pods Over Time",
          "type": "timeseries",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 15},
          "targets": [{
            "expr": "topk(5, sum(container_memory_working_set_bytes{node=\"$node\", container!=\"\", container!=\"POD\"}) by (namespace, pod)) / 1024 / 1024",
            "refId": "A",
            "legendFormat": "{{pod}} ({{namespace}})"
          }],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "mbytes"}}
        }
      ]
    }

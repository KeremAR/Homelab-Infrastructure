config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        valid_status_codes: []
        method: GET
        # Follow HTTP 3xx responses and evaluate the final destination.
        follow_redirects: true
        preferred_ip_protocol: ip4
    http_post_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        valid_status_codes: []
        method: POST
        # Follow HTTP 3xx responses and evaluate the final destination.
        follow_redirects: true
        preferred_ip_protocol: ip4

serviceMonitor:
  enabled: false

# Alloy discovers only pods explicitly marked with prometheus.io/scrape=true.
# Keep Blackbox Exporter's own pod out of that generic scrape path; Alloy uses
# the exporter's /probe endpoint explicitly instead.
podAnnotations:
  prometheus.io/scrape: "false"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

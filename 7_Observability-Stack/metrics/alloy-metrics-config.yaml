apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics-config
  namespace: observability
data:
  metrics.alloy: |
    // === METRICS COLLECTION (PROMETHEUS) ===
    // ========================================

    // --- 1. NODE-LEVEL METRICS: Unix Exporter (node-exporter equivalent) ---
    prometheus.exporter.unix "unix" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
      rootfs_path = "/host/root"
    }

    prometheus.scrape "unix" {
      targets    = prometheus.exporter.unix.unix.targets
      forward_to = [prometheus.remote_write.prometheus.receiver]
    }

    // --- 2. NODE-LEVEL METRICS: Kubelet (includes cAdvisor metrics) ---
    // Kubelet exposes container metrics at /metrics/cadvisor endpoint
    discovery.kubernetes "k8s_nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.k8s_nodes.targets
      
      // Set address to node IP and port
      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:10250"
      }
      
      // Set metrics path to cAdvisor endpoint
      rule {
        replacement  = "/metrics/cadvisor"
        target_label = "__metrics_path__"
      }
      
      // Set scheme to HTTPS
      rule {
        replacement  = "https"
        target_label = "__scheme__"
      }
      
      // Add node label
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      
      // Add job label
      rule {
        replacement  = "kubelet"
        target_label = "job"
      }
    }

    prometheus.scrape "kubelet" {
      targets    = discovery.relabel.kubelet.output
      
      // Verify kubelet serving certificates with the cluster CA
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    // --- 3. CLUSTER-LEVEL METRICS: Pod Discovery ---
    discovery.kubernetes "k8s_pods" {
      role = "pod"
    }

    discovery.relabel "k8s_pods" {
      targets = discovery.kubernetes.k8s_pods.targets
      
      // Keep only pods with prometheus.io/scrape=true annotation
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }
      
      // Use custom port from annotation if specified
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        action        = "replace"
        target_label  = "__address__"
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
      }
      
      // Use custom metrics path from annotation if specified (default /metrics)
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        action        = "replace"
        target_label  = "__metrics_path__"
        regex         = "(.+)"
      }
      
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        target_label  = "pod_phase"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }
    }

    prometheus.scrape "k8s_pods" {
      targets    = discovery.relabel.k8s_pods.output
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    // --- 4. ARGO ROLLOUTS METRICS ---
    prometheus.scrape "argo_rollouts" {
      targets = [{
        __address__ = "argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090",
        job         = "argo-rollouts",
      }]
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }
    
    // --- 5. CLUSTER-LEVEL METRICS: Annotated Service Endpoints ---
    // Pod and EndpointSlice discovery may run together. To avoid duplicate
    // ingestion, annotate either the Pod template or the Service for a given
    // workload, not both. Annotated Services must name their metrics port
    // "metrics"; this also prevents DNS and application ports from being
    // scraped accidentally.
    discovery.kubernetes "k8s_service_endpoints" {
      role = "endpointslice"
    }

    discovery.relabel "k8s_service_endpoints" {
      targets = discovery.kubernetes.k8s_service_endpoints.targets
      
      // Keep only services with prometheus.io/scrape=true annotation
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }

      // Scrape only the Service port explicitly named "metrics".
      rule {
        source_labels = ["__meta_kubernetes_endpointslice_port_name"]
        action        = "keep"
        regex         = "metrics"
      }

      // Ignore endpoints that are not ready.
      rule {
        source_labels = ["__meta_kubernetes_endpointslice_endpoint_conditions_ready"]
        action        = "keep"
        regex         = "true"
      }
      
      // Use custom metrics path from annotation if specified
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
        action        = "replace"
        target_label  = "__metrics_path__"
        regex         = "(.+)"
      }
      
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_service_name"]
        separator     = "/"
        target_label  = "job"
      }
    }

    prometheus.scrape "k8s_service_endpoints" {
      targets    = discovery.relabel.k8s_service_endpoints.output
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    // --- 6. KUBERNETES API SERVER ---
    prometheus.scrape "kube_apiserver" {
      targets = [{
        __address__      = "kubernetes.default.svc.cluster.local:443",
        __scheme__       = "https",
        __metrics_path__ = "/metrics",
        job              = "kube-apiserver",
      }]
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    // --- OPTIONAL: KUBE-PROXY (classic networking only) ---
    // Keep this disabled when Cilium runs with kubeProxyReplacement=true.
    // To use it on a classic kube-proxy cluster, expose metrics on
    // 0.0.0.0:10249 as described in install.md and remove the leading // from
    // the complete block below.
    //
    // discovery.relabel "kube_proxy" {
    //   targets = discovery.kubernetes.k8s_nodes.targets
    //   rule {
    //     source_labels = ["__meta_kubernetes_node_address_InternalIP"]
    //     target_label  = "__address__"
    //     replacement   = "$1:10249"
    //   }
    //   rule {
    //     source_labels = ["__meta_kubernetes_node_name"]
    //     target_label  = "node"
    //   }
    //   rule {
    //     replacement  = "kube-proxy"
    //     target_label = "job"
    //   }
    // }
    //
    // prometheus.scrape "kube_proxy" {
    //   targets    = discovery.relabel.kube_proxy.output
    //   forward_to = [prometheus.remote_write.prometheus.receiver]
    //   clustering {
    //     enabled = true
    //   }
    // }

    // The following control-plane endpoints are opened in install.md. The
    // scheduler and controller-manager use self-signed serving certificates,
    // so their metrics connections cannot be verified with the cluster CA.
    discovery.relabel "kube_scheduler" {
      targets = discovery.kubernetes.k8s_nodes.targets
      rule {
        source_labels = ["__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane"]
        action        = "keep"
        regex         = "true"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:10259"
      }
      rule {
        replacement  = "https"
        target_label = "__scheme__"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "kube-scheduler"
        target_label = "job"
      }
    }

    prometheus.scrape "kube_scheduler" {
      targets           = discovery.relabel.kube_scheduler.output
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    discovery.relabel "kube_controller_manager" {
      targets = discovery.kubernetes.k8s_nodes.targets
      rule {
        source_labels = ["__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane"]
        action        = "keep"
        regex         = "true"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:10257"
      }
      rule {
        replacement  = "https"
        target_label = "__scheme__"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "kube-controller-manager"
        target_label = "job"
      }
    }

    prometheus.scrape "kube_controller_manager" {
      targets           = discovery.relabel.kube_controller_manager.output
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    discovery.relabel "etcd" {
      targets = discovery.kubernetes.k8s_nodes.targets
      rule {
        source_labels = ["__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane"]
        action        = "keep"
        regex         = "true"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:2381"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "etcd"
        target_label = "job"
      }
    }

    prometheus.scrape "etcd" {
      targets    = discovery.relabel.etcd.output
      forward_to = [prometheus.remote_write.prometheus.receiver]
      clustering {
        enabled = true
      }
    }

    // --- 8. BLACKBOX EXPORTER: In-cluster Service Probes ---
    // Probes ClusterIP Services from the Blackbox Exporter pod.
    // Discovers services with annotation: blackbox.prometheus.io/scrape: "true"
    
    discovery.kubernetes "k8s_services_blackbox" {
      role = "service"
      namespaces {
        names = ["staging", "production"]
      }
    }

    discovery.relabel "blackbox_services" {
      targets = discovery.kubernetes.k8s_services_blackbox.targets
      
      // 1. Initialize defaults from service metadata or static values
      rule {
        source_labels = ["__meta_kubernetes_service_port_number"]
        target_label  = "__blackbox_port__"
      }
      rule {
        target_label  = "__blackbox_path__"
        replacement   = "/ready"
      }
      rule {
        target_label  = "__param_module"
        replacement   = "http_2xx"
      }
      rule {
        target_label  = "__metrics_path__"
        replacement   = "/probe"
      }

      // 2. Override with annotations if present
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_blackbox_prometheus_io_port"]
        regex         = "(.+)"
        target_label  = "__blackbox_port__"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_blackbox_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__blackbox_path__"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_blackbox_prometheus_io_module"]
        regex         = "(.+)"
        target_label  = "__param_module"
      }

      // 3. Filter: Keep only services with scrape=true
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_blackbox_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }

      // 4. Construct Target URL
      rule {
        source_labels = ["__meta_kubernetes_service_name", "__meta_kubernetes_namespace", "__blackbox_port__", "__blackbox_path__"]
        separator     = ";"
        target_label  = "__param_target"
        regex         = "([^;]+);([^;]+);([^;]+);(.+)"
        replacement   = "http://$1.$2.svc.cluster.local:$3$4"
      }

      // 5. Set Labels
      rule {
        source_labels = ["__meta_kubernetes_service_name", "__meta_kubernetes_namespace"]
        separator     = "."
        target_label  = "instance"
      }
      rule {
        target_label  = "__address__"
        replacement   = "blackbox-exporter-prometheus-blackbox-exporter.observability.svc.cluster.local:9115"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "job"
        replacement   = "blackbox-$1"
      }
    }

    prometheus.scrape "blackbox_probes" {
      targets         = discovery.relabel.blackbox_services.output
      forward_to      = [prometheus.remote_write.prometheus.receiver]
      scrape_interval = "15s"
      scrape_timeout  = "10s"
      clustering {
        enabled = true
      }
    }

    // --- 6. REMOTE WRITE: Send all metrics to Prometheus ---
    prometheus.remote_write "prometheus" {
      endpoint {
        url = "http://prometheus-server.observability.svc.cluster.local:80/api/v1/write"
      }
    }

    // ==========================================

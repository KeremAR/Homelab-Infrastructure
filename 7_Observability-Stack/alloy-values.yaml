controller:
  type: daemonset
  # Run one Alloy pod on the tainted control-plane node as well as on workers.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
      # Merge the three signal-specific ConfigMaps into one directory.
      # Alloy accepts a directory and loads every *.alloy file in it.
      - name: alloy-signal-configs
        projected:
          sources:
            - configMap:
                name: alloy-metrics-config
                items:
                  - key: metrics.alloy
                    path: metrics.alloy
            - configMap:
                name: alloy-logs-config
                items:
                  - key: logs.alloy
                    path: logs.alloy
            - configMap:
                name: alloy-traces-config
                items:
                  - key: traces.alloy
                    path: traces.alloy
      - name: elasticsearch-ca
        secret:
          # ECK creates this public CA Secret for the logs-es-http Service.
          secretName: logs-es-http-certs-public

alloy:
  configMap:
    create: false
    # The chart requires one primary ConfigMap. Its key points the fixed
    # /etc/alloy/<key> run argument at the projected configuration directory.
    name: alloy-bootstrap-config
    key: ../alloy-configs
  clustering:
    enabled: true
    portName: http
  envFrom:
    - secretRef:
        name: elastic-key-secret
  mounts:
    varlog: true
    dockercontainers: true
    extra:
      - name: proc
        mountPath: /host/proc
        readOnly: true
      - name: sys
        mountPath: /host/sys
        readOnly: true
      - name: root
        mountPath: /host/root
        readOnly: true
        mountPropagation: HostToContainer
      - name: alloy-signal-configs
        mountPath: /etc/alloy-configs
        readOnly: true
      - name: elasticsearch-ca
        mountPath: /etc/alloy/elasticsearch
        readOnly: true
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

rbac:
  create: true

# The chart reloader watches only its primary ConfigMap mount, not the
# projected signal ConfigMaps. Restart the DaemonSet after changing them.
configReloader:
  enabled: false

apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-detail-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  microservice-detail.json: |
    {
      "title": "Microservice Detail - RED Method Analysis",
      "uid": "microservice-detail",
      "tags": ["microservice", "red-method", "service", "detail"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(rollout_info_replicas_available, namespace)",
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "sort": 1
          },
          {
            "name": "service",
            "type": "query",
            "label": "Service",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(rollout_info_replicas_available{namespace=\"$namespace\"}, name)",
            "refresh": 2,
            "includeAll": false,
            "multi": false,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "🔄 Rollout Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "rollout_info_replicas_available{namespace=\"$namespace\", name=\"$service\"}",
              "refId": "A",
              "legendFormat": "Available"
            },
            {
              "expr": "rollout_info_replicas_desired{namespace=\"$namespace\", name=\"$service\"}",
              "refId": "B",
              "legendFormat": "Desired"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "red"},
                  {"value": 1, "color": "green"}
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "id": 2,
          "title": "📊 Rate - Request Rate (RPS)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", pod=~\"$service.*\"}[5m]))",
              "refId": "A"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "blue"}
                ]
              },
              "unit": "reqps",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "id": 3,
          "title": "🔥 Errors - Error Rate (5xx)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", pod=~\"$service.*\", status=~\"5..\"}[5m]))",
              "refId": "A"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 0.01, "color": "yellow"},
                  {"value": 0.1, "color": "red"}
                ]
              },
              "unit": "reqps",
              "decimals": 3
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "id": 4,
          "title": "⏱️ Duration - P95 Latency",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (le))",
              "refId": "A"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 0.5, "color": "yellow"},
                  {"value": 1, "color": "red"}
                ]
              },
              "unit": "s",
              "decimals": 3
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "id": 5,
          "title": "📊 Rate - Request Rate Over Time",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (pod)",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max", "mean"]
            }
          }
        },
        {
          "id": 6,
          "title": "🔥 Errors - HTTP Status Code Distribution",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (status)",
              "refId": "A",
              "legendFormat": "{{status}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 7,
          "title": "⏱️ Duration - Application Latency (p50/p95/p99)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (le))",
              "refId": "A",
              "legendFormat": "p50 - App Only"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (le))",
              "refId": "B",
              "legendFormat": "p95 - App Only"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (le))",
              "refId": "C",
              "legendFormat": "p99 - App Only"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 5,
                "showPoints": "never"
              },
              "color": {"mode": "palette-classic"}
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max", "mean"]
            }
          }
        },
        {
          "id": 14,
          "title": "🌐 Duration - In-Cluster Probe Latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "probe_duration_seconds{service=\"$service\", namespace=\"$namespace\"}",
              "refId": "A",
              "legendFormat": "Blackbox Probe (In-Cluster)"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$service.*\"}[5m])) by (le))",
              "refId": "B",
              "legendFormat": "p95 - App Only (comparison)"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "auto"
              },
              "color": {"mode": "palette-classic"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 0.5, "color": "yellow"},
                  {"value": 1.0, "color": "orange"},
                  {"value": 2.0, "color": "red"}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "End-to-End (Blackbox)"},
                "properties": [
                  {"id": "custom.lineWidth", "value": 2},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max", "mean"]
            }
          }
        },
        {
          "id": 8,
          "title": "💻 Resources - CPU Usage by Pod",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"$service.*\", container!=\"\", container!=\"POD\"}[5m])) by (pod)",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 9,
          "title": "💾 Resources - Memory Usage by Pod",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"$service.*\", container!=\"\", container!=\"POD\"}) by (pod) / 1024 / 1024",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 10,
          "title": "📝 Logs - Service Logs (Loki)",
          "type": "logs",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 28},
          "targets": [
            {
              "expr": "{namespace=\"$namespace\", pod=~\"$service.*\"}",
              "refId": "A"
            }
          ],
          "datasource": {"type": "loki", "uid": "loki"},
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 11,
          "title": "🔍 Tracing - Jaeger Link",
          "type": "text",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 38},
          "options": {
            "mode": "html",
            "content": "<h3>🔍 Distributed Tracing</h3><p><strong>Service:</strong> <code>$service</code></p><p><strong>Namespace:</strong> <code>$namespace</code></p><p><a href=\"http://jaeger.192.168.0.110.nip.io/search?service=$service\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 Open Jaeger UI</a></p><p><strong>Internal Service:</strong> <code>jaeger.observability.svc.cluster.local:16686</code></p>"
          }
        },
        {
          "id": 12,
          "title": "🔄 Pod Restart Rate",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 42},
          "targets": [
            {
              "expr": "rate(kube_pod_container_status_restarts_total{namespace=\"$namespace\", pod=~\"$service.*\"}[5m]) > 0",
              "refId": "A",
              "legendFormat": "{{pod}} - {{container}}"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "fillOpacity": 50,
                "showPoints": "never"
              },
              "color": {"mode": "palette-classic"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 0.01, "color": "red"}
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            }
          }
        },
        {
          "id": 13,
          "title": "⚠️ Pod Status Events",
          "type": "table",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 42},
          "targets": [
            {
              "expr": "kube_pod_container_status_waiting_reason{namespace=\"$namespace\", pod=~\"$service.*\", reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull\"} > 0",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "kube_pod_container_status_terminated_reason{namespace=\"$namespace\", pod=~\"$service.*\", reason=~\"OOMKilled|Error\"} > 0",
              "refId": "B",
              "instant": true,
              "format": "table"
            }
          ],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "namespace": true,
                  "uid": true
                },
                "indexByName": {
                  "pod": 0,
                  "container": 1,
                  "reason": 2,
                  "Value": 3
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "reason": "Event Reason",
                  "Value": "Status"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "color-background"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "red"}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Event Reason"},
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-text"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "OOMKilled": {"color": "dark-red", "text": "🔴 OOMKilled (Memory Limit)"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "CrashLoopBackOff": {"color": "dark-orange", "text": "🟠 CrashLoopBackOff"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "ImagePullBackOff": {"color": "dark-yellow", "text": "🟡 ImagePullBackOff"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "ErrImagePull": {"color": "dark-yellow", "text": "🟡 ErrImagePull"}
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "Error": {"color": "dark-red", "text": "🔴 Error"}
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": []
          }
        }
      ]
    }

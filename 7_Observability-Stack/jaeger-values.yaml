# Jaeger chart v4 deploys the unified Jaeger v2 binary. Its default in-memory
# backend is intentional here: traces are ephemeral in this learning cluster.
jaeger:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

spark:
  enabled: false
esIndexCleaner:
  enabled: false
esRollover:
  enabled: false
esLookback:
  enabled: false

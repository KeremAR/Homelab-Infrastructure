apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway
  hostnames:
    - hubble.192.168.0.110.nip.io
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80

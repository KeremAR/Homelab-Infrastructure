# Cilium CNI with eBPF kube-proxy replacement.
k8sServiceHost: 192.168.0.150
k8sServicePort: 6443

# Replace kube-proxy's iptables/IPVS Service datapath with Cilium eBPF for
# ClusterIP, NodePort, LoadBalancer, ExternalIP and hostPort forwarding.
kubeProxyReplacement: true

routingMode: tunnel
tunnelProtocol: geneve

ipam:
  # Reuse the 10.244.0.0/24 PodCIDRs already assigned in Node.spec.podCIDR.
  mode: kubernetes

cni:
  customConf: false
  uninstall: false
  # Required so Istio CNI can coexist with Cilium.
  exclusive: false

operator:
  replicas: 2
  unmanagedPodWatcher:
    restart: true

policyEnforcementMode: default

bpf:
  hostLegacyRouting: false

# Required when Istio is used with Cilium socket-level load balancing.
socketLB:
  enabled: true
  hostNamespaceOnly: true

# Cilium owns CNI and the eBPF Service datapath. Its Ingress, Gateway API,
# standalone Envoy and L7 proxy are disabled so Istio and Envoy Gateway own
# those responsibilities without competing controllers.
l7Proxy: false
envoy:
  enabled: false
ingressController:
  enabled: false
gatewayAPI:
  enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp

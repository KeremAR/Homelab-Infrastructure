# Apply with envsubst so secret values stay in your local .env file:
#
#   set -a
#   source .env
#   set +a
#   envsubst < 7-CI-CD-Setup/jenkins/jenkins-secrets.yaml | kubectl apply -f -
#
# Required .env values:
#   JENKINS_ADMIN_USER=admin
#   JENKINS_ADMIN_PASSWORD=change-me
#   GITHUB_USERNAME=KeremAR
#   GITHUB_TOKEN=ghp_...
#   DOCKER_CONFIG_JSON=base64_encoded_docker_config_json
#   SONAR_TOKEN=squ_...
#   DEPENDENCY_TRACK_API_KEY=odt_...
#   KUBECONFIG_B64=base64_encoded_kubeconfig
#
# DOCKER_CONFIG_JSON is the base64 encoded Docker config JSON used by the
# Kubernetes imagePullSecret. It is not a second token.
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-secret
  namespace: jenkins
type: Opaque
stringData:
  jenkins-admin-user: "${JENKINS_ADMIN_USER}"
  jenkins-admin-password: "${JENKINS_ADMIN_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-github-secret
  namespace: jenkins
type: Opaque
stringData:
  github-username: "${GITHUB_USERNAME}"
  github-token: "${GITHUB_TOKEN}"
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-app-secrets
  namespace: jenkins
type: Opaque
stringData:
  sonar-token: "${SONAR_TOKEN}"
  dependency-track-api-key: "${DEPENDENCY_TRACK_API_KEY}"
  kubeconfig-b64: "${KUBECONFIG_B64}"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-creds
  namespace: jenkins
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "${DOCKER_CONFIG_JSON}"
